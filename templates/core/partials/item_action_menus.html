<script>
    (() => {
        const actionMenus = document.querySelectorAll(".item-action-menu");
        const supportsMenuHover = window.matchMedia("(hover: hover) and (pointer: fine)");

        const closeMenu = (menu, { restoreFocus = false } = {}) => {
            menu.removeAttribute("open");
            menu.classList.remove("item-action-menu--drop-up");
            const summary = menu.querySelector("summary");
            const popover = menu.querySelector(".item-action-menu__popover");
            if (popover) popover.style.transform = "";
            if (restoreFocus) summary?.focus();
            else summary?.blur();
        };

        const positionMenu = (menu) => {
            menu.classList.remove("item-action-menu--drop-up");
            const popover = menu.querySelector(".item-action-menu__popover");
            if (!popover) return;
            popover.style.transform = "";

            const popoverRect = popover.getBoundingClientRect();
            const menuRect = menu.getBoundingClientRect();
            const spaceBelow = window.innerHeight - menuRect.bottom;
            const spaceAbove = menuRect.top;
            if (popoverRect.height > spaceBelow - 12 && spaceAbove > popoverRect.height + 12) {
                menu.classList.add("item-action-menu--drop-up");
            } else if (popoverRect.bottom > window.innerHeight - 12) {
                const overflow = popoverRect.bottom - window.innerHeight + 12;
                popover.style.transform = `translateY(-${overflow}px)`;
            }
        };

        actionMenus.forEach((menu) => {
            let openTimer;
            let closeTimer;

            menu.querySelector("summary")?.addEventListener("click", () => clearTimeout(openTimer));

            menu.addEventListener("mouseenter", () => {
                clearTimeout(closeTimer);
                if (!supportsMenuHover.matches || menu.open) return;
                openTimer = setTimeout(() => menu.setAttribute("open", ""), 140);
            });

            menu.addEventListener("mouseleave", () => {
                clearTimeout(openTimer);
                closeTimer = setTimeout(() => closeMenu(menu), 220);
            });

            menu.addEventListener("toggle", () => {
                if (!menu.open) {
                    menu.classList.remove("item-action-menu--drop-up");
                    const popover = menu.querySelector(".item-action-menu__popover");
                    if (popover) popover.style.transform = "";
                    return;
                }
                actionMenus.forEach((otherMenu) => {
                    if (otherMenu !== menu) closeMenu(otherMenu);
                });
                positionMenu(menu);
            });
        });

        window.addEventListener("resize", () => {
            const openMenu = document.querySelector(".item-action-menu[open]");
            if (openMenu) positionMenu(openMenu);
        });

        document.addEventListener("click", (event) => {
            actionMenus.forEach((menu) => {
                if (!menu.contains(event.target)) closeMenu(menu);
            });
        });

        document.addEventListener("keydown", (event) => {
            if (event.key !== "Escape") return;
            const openMenu = document.querySelector(".item-action-menu[open]");
            if (openMenu) closeMenu(openMenu, { restoreFocus: true });
        });
    })();
</script>
