<span class="contact-icon contact-icon--{{ kind }}{% if compact %} contact-icon--compact{% endif %}" aria-hidden="true">
    {% if kind == "max" %}
        <span class="contact-icon__wordmark-frame"><span class="contact-icon__wordmark">MAX</span></span>
    {% elif kind == "vk" %}
        <span class="contact-icon__wordmark-frame"><span class="contact-icon__wordmark">VK</span></span>
    {% else %}
        <svg viewBox="0 0 24 24" focusable="false">
            {% if kind == "phone" %}
                <path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 3.1 5.2 2 2 0 0 1 5.1 3h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L9 11a16 16 0 0 0 4 4l1.3-1.3a2 2 0 0 1 2.1-.5c1 .4 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/>
            {% elif kind == "email" %}
                <rect x="2" y="4" width="20" height="16" rx="2.25"/>
                <path d="m2 6.5 10 6.75 10-6.75"/>
            {% elif kind == "telegram" %}
                <path class="contact-icon__fill" d="m21.4 3.5-3.1 16.1c-.2 1.1-.9 1.4-1.8.9l-4.7-3.5-2.3 2.2c-.2.3-.5.5-1 .5l.3-4.8 8.8-8c.4-.3-.1-.5-.6-.2L6.1 13.5l-4.7-1.5c-1-.3-1-1 .2-1.5L20 3.4c.9-.3 1.6.2 1.4 1.1Z"/>
            {% elif kind == "whatsapp" %}
                <circle class="contact-icon__brand-background" cx="12" cy="12" r="10"/>
                <path class="contact-icon__brand-foreground" d="M12 5.3a6.7 6.7 0 0 0-5.8 10l-1 3.6 3.7-1A6.7 6.7 0 1 0 12 5.3Z"/>
                <path class="contact-icon__brand-background" d="M9.1 8.2c.2-.4.4-.4.7-.4h.4c.2 0 .3.1.4.4l.7 1.8c.1.3.1.5-.1.7l-.5.6c-.2.2-.1.4 0 .6.7 1.2 1.7 2.1 2.9 2.7.3.1.5.1.7-.1l.7-.8c.2-.2.4-.3.7-.2l1.7.8c.3.1.4.3.4.5 0 .3-.2 1.3-.9 1.8-.6.5-1.4.7-2.3.4-.9-.3-3.6-1.3-5.3-4.2-1.4-2.4-1.4-3.4-.2-4.6Z"/>
            {% elif kind == "instagram" %}
                <rect x="2" y="2" width="20" height="20" rx="5.5"/>
                <circle cx="12" cy="12" r="4.4"/>
                <circle class="contact-icon__fill" cx="18" cy="6" r="1"/>
            {% elif kind == "facebook" %}
                <circle class="contact-icon__brand-background" cx="12" cy="12" r="10"/>
                <path class="contact-icon__brand-foreground" d="M13.4 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.6 1.6-1.6h1.7V3.8c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2H7.2v3H10v8h3.4Z"/>
            {% elif kind == "website" %}
                <circle cx="12" cy="12" r="10"/>
                <path d="M2 12h20M12 2a15.5 15.5 0 0 1 0 20M12 2a15.5 15.5 0 0 0 0 20"/>
            {% elif kind == "referral" %}
                <circle cx="9" cy="8" r="3"/>
                <path d="M3.5 19a5.5 5.5 0 0 1 11 0M16 8h5M18.5 5.5v5"/>
            {% elif kind == "advertising" %}
                <path d="m4 13 12-5v8L4 13Z"/>
                <path d="M16 10.5a3 3 0 0 1 0 3M6.5 14l1.2 5h3l-1.5-6"/>
            {% else %}
                <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>
                <circle cx="12" cy="12" r="3"/>
            {% endif %}
        </svg>
    {% endif %}
</span>
