<span class="vendor-contact-icon vendor-contact-icon--{{ kind }}" aria-hidden="true">
    {% if kind == "max" %}
        <span class="vendor-contact-icon__wordmark">MAX</span>
    {% elif kind == "vk" %}
        <span class="vendor-contact-icon__wordmark">VK</span>
    {% else %}
        <svg viewBox="0 0 24 24" focusable="false">
            {% if kind == "phone" %}
                <path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 3.1 5.2 2 2 0 0 1 5.1 3h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L9 11a16 16 0 0 0 4 4l1.3-1.3a2 2 0 0 1 2.1-.5c1 .4 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/>
            {% elif kind == "email" %}
                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <path d="m3 7 9 6 9-6"/>
            {% elif kind == "messenger" %}
                <path d="M20 15a3 3 0 0 1-3 3H9l-5 3v-6a3 3 0 0 1-1-2.2V7a3 3 0 0 1 3-3h11a3 3 0 0 1 3 3Z"/>
                <path d="M8 9h8M8 13h5"/>
            {% elif kind == "telegram" %}
                <path class="vendor-contact-icon__fill" d="m21.4 3.5-3.1 16.1c-.2 1.1-.9 1.4-1.8.9l-4.7-3.5-2.3 2.2c-.2.3-.5.5-1 .5l.3-4.8 8.8-8c.4-.3-.1-.5-.6-.2L6.1 13.5l-4.7-1.5c-1-.3-1-1 .2-1.5L20 3.4c.9-.3 1.6.2 1.4 1.1Z"/>
            {% elif kind == "whatsapp" %}
                <path d="M20.5 11.6a8.5 8.5 0 0 1-12.6 7.5L3 20.5l1.3-4.7a8.5 8.5 0 1 1 16.2-4.2Z"/>
                <path d="M8.4 7.8c.2-.4.4-.4.7-.4h.4c.2 0 .3.1.4.4l.8 2c.1.3.1.5-.1.7l-.6.7c-.2.2-.1.4 0 .6.8 1.4 1.9 2.5 3.4 3.2.3.1.5.1.7-.1l.8-1c.2-.2.4-.3.7-.2l2 .9c.3.1.4.3.4.5 0 .3-.2 1.5-1 2.1-.7.6-1.6.8-2.6.5-1-.3-4.2-1.5-6.2-4.9-1.7-2.8-1.7-4-.9-5Z"/>
            {% elif kind == "instagram" %}
                <rect x="3" y="3" width="18" height="18" rx="5"/>
                <circle cx="12" cy="12" r="4"/>
                <circle class="vendor-contact-icon__fill" cx="17.5" cy="6.5" r="1"/>
            {% elif kind == "website" %}
                <circle cx="12" cy="12" r="9"/>
                <path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>
            {% endif %}
        </svg>
    {% endif %}
</span>
