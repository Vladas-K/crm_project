<script>
    (() => {
        const interactiveSelector = "a, button, input, select, textarea, summary, details, label, [contenteditable='true']";

        document.querySelectorAll("[data-profile-url]").forEach((card) => {
            const openProfile = () => window.location.assign(card.dataset.profileUrl);

            card.addEventListener("click", (event) => {
                if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
                if (event.target.closest(interactiveSelector)) return;
                if (window.getSelection()?.toString()) return;
                openProfile();
            });

            card.addEventListener("keydown", (event) => {
                if (event.target !== card || event.key !== "Enter") return;
                event.preventDefault();
                openProfile();
            });
        });
    })();
</script>
