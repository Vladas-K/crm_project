<div class="lead-form-field{% if field_class %} {{ field_class }}{% endif %}">
    <label class="lead-form-field__label" for="{{ field.id_for_label }}">
        {{ field.label }}{% if field.field.required %}<span class="lead-form-field__required" aria-hidden="true"> *</span>{% endif %}
    </label>
    {{ field }}
    {% if help_text %}
        <div class="lead-form-field__help">{{ help_text }}</div>
    {% elif field.help_text %}
        <div class="lead-form-field__help">{{ field.help_text }}</div>
    {% endif %}
    {% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
</div>
